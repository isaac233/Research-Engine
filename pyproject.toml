[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-engine"
version = "0.1.0"
description = "Model-agnostic, locally-driven research apparatus for AI-assisted internet research."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Isaac", email = "isaac@example.com" }
]
keywords = ["research", "ai", "ollama", "browser", "literature-review"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "duckdb>=1.0",
    "anthropic>=0.30",
    "feedparser>=6.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
]
pdf = [
    "pypdf>=4.2",
    "pdfplumber>=0.11",
]
tui = [
    # Arrow-key quality/speed slider; falls back to numbered prompt if absent.
    "prompt_toolkit>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "mcp>=1.0",
]

[project.scripts]
research-engine = "research_engine.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]
force-include = { "config" = "config" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --cov=research_engine --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
