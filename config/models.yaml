# Model registry for the Research Engine.
# Provider-specific clients live in src/research_engine/llm/.
providers:
  ollama:
    base_url: "http://localhost:11434"
    default_model: "gemma4"
    roles:
      - planner
      - worker
      - reviewer
    context_window: 131072
    cost_tier: local
    rate_limit_rpm: 60

  anthropic:
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "claude-opus-4-8"
    roles:
      - auditor
      - synthesizer
    context_window: 200000
    cost_tier: premium
    rate_limit_rpm: 40

# Role-to-provider fallback chain.
role_defaults:
  planner: [ollama]
  worker: [ollama]
  reviewer: [ollama]
  auditor: [anthropic, ollama]
  synthesizer: [anthropic, ollama]
